# Production Docker Compose profile for Dokploy.
#
# In Dokploy, select this file as the Compose Path, choose Docker Compose (not
# Docker Stack), enable Isolated Deployments, and configure domains in the UI.
# The UI supplies the variables referenced below through its generated .env.
# Do not add host `ports:` mappings: Dokploy's Traefik routes web and api.

x-backend-environment: &backend-environment
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Dokploy}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in Dokploy}
  S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in Dokploy}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in Dokploy}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in Dokploy}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in Dokploy}
  ARTIFACT_BACKEND: ${ARTIFACT_BACKEND:-s3}
  # Bundled MinIO has no KMS. This explicit mode is NOT an encryption fallback.
  # Protect its named volume with host-disk encryption. For managed S3/KMS,
  # configure AES256 or aws:kms instead; failed encrypted writes stay failed.
  S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-none}
  APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in Dokploy}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in Dokploy}
  UPLOAD_DIR: /var/lib/flexy/uploads
  ARTIFACT_DIR: /var/lib/flexy/artifacts
  WORK_DIR: /var/lib/flexy/work
  FLEXY_RECIPE_DIR: /srv/flexy/fixtures/recipes
  QUEUE_MODE: dramatiq
  ALLOW_DEMO_INLINE_QUEUE: "false"
  AUTO_CREATE_SCHEMA: "false"
  # Docker's stock seccomp policy commonly blocks the user namespace required
  # by Bubblewrap. Leave builds fail-closed until an operator-installed,
  # narrowly reviewed worker sandbox policy and the host preflight in
  # docs/dokploy.md have both passed, then explicitly set this to bwrap.
  BUILD_EXECUTOR: ${BUILD_EXECUTOR:-unavailable}
  BWRAP_PATH: /usr/bin/bwrap
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  MAX_EXTRACTION_BYTES: ${MAX_EXTRACTION_BYTES:-262144000}
  MAX_FILE_COUNT: ${MAX_FILE_COUNT:-10000}
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-300}
  JOB_RETENTION_HOURS: ${JOB_RETENTION_HOURS:-24}
  DOWNLOAD_TOKEN_TTL_SECONDS: ${DOWNLOAD_TOKEN_TTL_SECONDS:-900}
  LOG_LIMIT_BYTES: ${LOG_LIMIT_BYTES:-1048576}
  CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-3600}

# Alembic only needs the database connection. Keeping object-store and queue
# credentials out of this one-shot container narrows its deployment exposure.
x-migration-environment: &migration-environment
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Dokploy}

x-hardened-container: &hardened-container
  read_only: true
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

services:
  # Attach domain routes through Dokploy's Domains tab:
  # - same host /      -> web :3000
  # - same host /v1    -> api :8000 (Strip Path must remain disabled)
  web:
    <<: *hardened-container
    # Dokploy's isolated routing network matches the CLI -p project name.
    # Explicit selection prevents Traefik from using the private network.
    # Use list syntax: Dokploy 0.29 appends domain labels only to arrays.
    labels:
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    environment:
      FLEXY_API_UPSTREAM: http://api:8000
    networks:
      - default
      - private
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128

  migrate:
    <<: *hardened-container
    build:
      context: .
      dockerfile: infra/docker/backend-service.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *migration-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: "no"
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

  api:
    <<: *hardened-container
    labels:
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}
    build:
      context: .
      dockerfile: infra/docker/backend-service.Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-environment
    expose:
      - "8000"
    volumes:
      - flexy_uploads:/var/lib/flexy/uploads
      - flexy_artifacts:/var/lib/flexy/artifacts
      - flexy_work:/var/lib/flexy/work
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - private
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  worker:
    <<: *hardened-container
    build:
      context: .
      dockerfile: infra/docker/backend-service.Dockerfile
    command: ["dramatiq", "app.worker", "--processes", "1", "--threads", "2"]
    environment: *backend-environment
    volumes:
      - flexy_uploads:/var/lib/flexy/uploads
      - flexy_artifacts:/var/lib/flexy/artifacts
      - flexy_work:/var/lib/flexy/work
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - private
    restart: unless-stopped
    # Let an in-flight five-minute sandboxed job finish on a planned redeploy.
    stop_grace_period: 6m
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in Dokploy}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in Dokploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    volumes:
      - flexy_postgres:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-ec", "exec redis-server --appendonly yes --save 60 1 --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
    volumes:
      - flexy_redis:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50

  minio:
    build:
      context: .
      dockerfile: infra/docker/minio.Dockerfile
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in Dokploy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Dokploy}
    volumes:
      - flexy_minio:/data
    networks:
      - private
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0

  minio-init:
    build:
      context: .
      dockerfile: infra/docker/minio-client.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in Dokploy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Dokploy}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in Dokploy}
    entrypoint: ["/bin/sh", "-ec"]
    # One shell argument: a scalar command would be split into argv, causing
    # sh -c to run only `attempts=0;` and falsely report a successful init.
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempts=$$((attempts + 1)); test "$$attempts" -lt 30 || exit 1; sleep 1
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        mc ilm rule add --expire-days 1 "local/$$S3_BUCKET" ||
          mc ilm rule list "local/$$S3_BUCKET" | grep -q "Expiration"
    depends_on:
      minio:
        condition: service_started
    networks:
      - private
    restart: "no"

networks:
  # Dokploy's Isolated Deployments feature adds its routing network to web/api.
  # This network carries web-to-API and backend-to-datastore traffic.
  private:
    internal: true

volumes:
  # Docker named volumes are durable across Dokploy deploys and support its
  # Volume Backups feature. Do not replace these with repository bind mounts.
  flexy_postgres:
  flexy_redis:
  flexy_minio:
  flexy_uploads:
  flexy_artifacts:
  flexy_work:
