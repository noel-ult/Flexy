name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend checks and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: https://flexy.noelbiju.in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Test frontend behavior
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Build root frontend Dockerfile
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" -t flexy-web:check .
      - name: Smoke-test frontend container
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -p 127.0.0.1:3000:3000 flexy-web:check)
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ -o /tmp/flexy-home.html; then
              grep -q "Turn a supported Debian package" /tmp/flexy-home.html
              exit 0
            fi
            sleep 1
          done
          exit 1

  scripts:
    name: Deployment helper regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make scripts-check

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e 'backend[dev]'
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Test backend
        if: ${{ !cancelled() }}
        working-directory: backend
        run: pytest -q
