name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend checks and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Test frontend behavior
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Build root frontend Dockerfile
        run: docker build -t flexy-web:check .
      - name: Smoke-test frontend container
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m -p 127.0.0.1:3000:3000 flexy-web:check)
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ -o /tmp/flexy-home.html; then
              grep -q "Turn a supported Debian package" /tmp/flexy-home.html
              status=$(curl --silent -o /tmp/flexy-api-error.json -w '%{http_code}' http://127.0.0.1:3000/v1/jobs)
              test "$status" = 503
              grep -q 'backend_not_configured' /tmp/flexy-api-error.json
              exit 0
            fi
            sleep 1
          done
          exit 1

  integration:
    name: Real stack desktop and mobile upload tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: flexy-ci-check
      COMPOSE_FILE: compose.dokploy.yaml:compose.check.yaml
      COMPOSE_ENV_FILES: infra/ci/.env.example
      NEXT_PUBLIC_API_BASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build and start the real production stack
        run: |
          docker compose config --quiet
          docker compose up -d --build
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ -o /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Test real queued analysis and reports through the browser
        working-directory: web
        run: npm run test:e2e
      - name: Diagnose CI-only storage if browser verification fails
        if: failure()
        run: |
          docker compose exec -T api python - <<'PY'
          from app.services import get_container
          container = get_container()
          # CI-only throwaway objects and credentials, never a production probe.
          try:
              container.store.client.put_object(Bucket=container.store.bucket, Key='ci/storage-probe', Body=b'CI probe')
              print('Basic private S3 PutObject: passed')
              container.store.put_bytes('ci/storage-probe-stream', b'CI probe')
              print('Configured S3 adapter stream upload: passed')
          except Exception as error:
              cause = error.__cause__ or error
              response = getattr(cause, 'response', {})
              print('Storage exception class:', type(cause).__name__)
              print('S3 error:', response.get('Error', {}).get('Code', 'not supplied'))
          finally:
              container.store.delete_prefix('ci')
          PY
      - name: Save browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          path: /tmp/flexy-browser-results/**/test-failed-*.png
          if-no-files-found: ignore
      - name: Show service state and remove disposable CI data
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100 api worker migrate web minio minio-init
          docker compose down --volumes --remove-orphans

  scripts:
    name: Deployment helper regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make scripts-check

  portable-backend:
    name: Native inspection image (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native control-plane test image
        run: docker build --target test -f infra/docker/backend-service.Dockerfile -t flexy-inspection:test .
      - name: Test safe analysis, jobs, artifact access and unavailable builds
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m flexy-inspection:test python -m unittest discover -s tests -t . -v

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e 'backend[dev]'
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Test backend
        if: ${{ !cancelled() }}
        working-directory: backend
        run: pytest -q
