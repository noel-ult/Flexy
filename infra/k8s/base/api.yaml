apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexy-api
  labels:
    app.kubernetes.io/name: flexy-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flexy-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flexy-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: flexy-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/flexy-backend:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: flexy-runtime-config
            - secretRef:
                name: flexy-runtime-secrets
          env:
            - name: UPLOAD_DIR
              value: /var/lib/flexy/uploads
            - name: ARTIFACT_DIR
              value: /var/lib/flexy/artifacts
            - name: WORK_DIR
              value: /var/lib/flexy/work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: upload-scratch
              mountPath: /var/lib/flexy/uploads
            - name: artifact-scratch
              mountPath: /var/lib/flexy/artifacts
            - name: work-scratch
              mountPath: /var/lib/flexy/work
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: upload-scratch
          emptyDir:
            sizeLimit: 300Mi
        - name: artifact-scratch
          emptyDir:
            sizeLimit: 300Mi
        - name: work-scratch
          emptyDir:
            sizeLimit: 350Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flexy-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flexy-api
