apiVersion: v1
kind: ServiceAccount
metadata:
  name: flexy-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flexy-worker
# This is the only application identity that may create short-lived build Jobs.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flexy-builder
# A build has no Kubernetes API token and no RBAC permissions.
automountServiceAccountToken: false
