# Do not apply this file or commit real values. Create flexy-runtime-secrets
# through External Secrets, Sealed Secrets, or your platform's secret manager.
# Required string keys are documented in docs/deployment.md.
apiVersion: v1
kind: Secret
metadata:
  name: flexy-runtime-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://USER:PASSWORD@HOST:5432/flexy
  REDIS_URL: redis://HOST:6379/0
  S3_ACCESS_KEY: replace-me
  S3_SECRET_KEY: replace-me
