name: flexy

x-backend-environment: &backend-environment
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  ARTIFACT_BACKEND: ${ARTIFACT_BACKEND}
  APP_BASE_URL: ${APP_BASE_URL}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
  UPLOAD_DIR: ${UPLOAD_DIR}
  ARTIFACT_DIR: ${ARTIFACT_DIR}
  WORK_DIR: ${WORK_DIR}
  FLEXY_RECIPE_DIR: ${FLEXY_RECIPE_DIR}
  QUEUE_MODE: ${QUEUE_MODE}
  ALLOW_DEMO_INLINE_QUEUE: ${ALLOW_DEMO_INLINE_QUEUE}
  AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA}
  BUILD_EXECUTOR: ${BUILD_EXECUTOR}
  BWRAP_PATH: ${BWRAP_PATH}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES}
  MAX_EXTRACTION_BYTES: ${MAX_EXTRACTION_BYTES}
  MAX_FILE_COUNT: ${MAX_FILE_COUNT}
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS}
  JOB_RETENTION_HOURS: ${JOB_RETENTION_HOURS}
  DOWNLOAD_TOKEN_TTL_SECONDS: ${DOWNLOAD_TOKEN_TTL_SECONDS}
  LOG_LIMIT_BYTES: ${LOG_LIMIT_BYTES}

x-hardened-container: &hardened-container
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

services:
  web:
    <<: *hardened-container
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "${WEB_PORT}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped

  api:
    <<: *hardened-container
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-environment
    ports:
      - "${API_PORT}:8000"
    volumes:
      - uploads:/var/lib/flexy/uploads
      - artifacts:/var/lib/flexy/artifacts
      - work:/var/lib/flexy/work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - edge
      - private
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *hardened-container
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["dramatiq", "app.worker"]
    environment: *backend-environment
    volumes:
      - uploads:/var/lib/flexy/uploads
      - artifacts:/var/lib/flexy/artifacts
      - work:/var/lib/flexy/work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - private
    restart: unless-stopped

  # On-demand verification containers; they are not started by `docker compose up`.
  api-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: test
    command: ["sh", "-ec", "ruff check . && pytest -q"]
    environment:
      DATABASE_URL: sqlite:////tmp/flexy-test.db
      ARTIFACT_BACKEND: local
      UPLOAD_DIR: /tmp/uploads
      ARTIFACT_DIR: /tmp/artifacts
      WORK_DIR: /tmp/work
      FLEXY_RECIPE_DIR: /srv/flexy/fixtures/recipes
      QUEUE_MODE: inline
      BUILD_EXECUTOR: unavailable
      ALLOW_DEMO_INLINE_QUEUE: "true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    networks: []

  web-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: build
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    command: ["sh", "-ec", "npm run typecheck && npm run lint && npm run test"]
    networks: []

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio:/data
    ports:
      - "${MINIO_CONSOLE_PORT}:9001"
    networks:
      - private
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      attempts=0;
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      do attempts=$$((attempts + 1)); test "$$attempts" -lt 30 || exit 1; sleep 1; done;
      mc mb --ignore-existing "local/$${S3_BUCKET}";
      mc anonymous set none "local/$${S3_BUCKET}";
      mc ilm rule add --expire-days 1 "local/$${S3_BUCKET}"
    depends_on:
      minio:
        condition: service_started
    networks:
      - private
    restart: "no"

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
    internal: true

volumes:
  postgres:
  minio:
  uploads:
  artifacts:
  work:
